# CustomLobby Sound Configuration
# Sound names: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
#
# Each entry has:
#   enabled: true/false   - whether this sound plays at all
#   sound:   SOUND_NAME   - Bukkit Sound enum name
#   volume:  0.0-1.0      - volume (1.0 = full)
#   pitch:   0.5-2.0      - pitch (1.0 = normal, <1 lower, >1 higher)
#   broadcast: false      - if true, ALL players hear it; if false, only the target player

sounds:
  enabled: true
  
  # Played when a player joins the server
  join:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 0.6
    pitch: 1.2
    broadcast: false
  
  # Played when a player quits (to remaining players)
  quit:
    enabled: false
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.5
    pitch: 0.8
    broadcast: true
  
  # Played when a player is teleported to spawn
  spawn-teleport:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.5
    pitch: 1.3
    broadcast: false
  
  # Played when double jump is used
  double-jump:
    enabled: true
    sound: ENTITY_FIREWORK_ROCKET_LAUNCH
    volume: 0.4
    pitch: 1.6
    broadcast: false
  
  # Played when a parkour course starts
  parkour-start:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.0
    broadcast: false
  
  # Played when a checkpoint is reached
  parkour-checkpoint:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.8
    pitch: 1.4
    broadcast: false
  
  # Played when the parkour is finished
  parkour-finish:
    enabled: true
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
    broadcast: false
  
  # Played when the player falls and is reset
  parkour-fail:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 0.8
    broadcast: false
  
  # Played when a player goes AFK
  afk-on:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.4
    pitch: 0.6
    broadcast: false
  
  # Played when a player returns from AFK
  afk-off:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 0.4
    pitch: 1.0
    broadcast: false
  
  # Played when vanish is enabled
  vanish-on:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.4
    pitch: 1.8
    broadcast: false
  
  # Played when vanish is disabled
  vanish-off:
    enabled: true
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 0.4
    pitch: 0.8
    broadcast: false
  
  # Played when clicking a GUI button
  gui-click:
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 0.5
    pitch: 1.0
    broadcast: false
  
  # Played when an error occurs (no permission, invalid usage, etc.)
  error:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 0.5
    pitch: 1.0
    broadcast: false
