beast_bat_motion:
  offset: left
  images:
    1:
      name: beast_bat
      x: -170
      y: -145
      layer: 40
      scale: 0.7
  animations:
    type: loop
    duration: 80
    x-equation: 2*t
    y-equation: 5*sin(t*0.18)
beast_snow_motion:
  offset: left
  images:
    1:
      name: beast_snowflake
      x: -138
      y: -160
      layer: 40
      scale: 0.7
    2:
      name: beast_snowflake
      x: -78
      y: -150
      layer: 40
      scale: 0.55
    3:
      name: beast_snowflake
      x: -25
      y: -164
      layer: 40
      scale: 0.7
  animations:
    type: loop
    duration: 80
    x-equation: 3*sin(t*0.12)
    y-equation: 0.65*t
    opacity-equation: min(1,(80-t)/20)
