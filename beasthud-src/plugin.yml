name: BeastHudThemes
version: 1.0.0
main: de.beastsmp.hud.BeastHudPlugin
api-version: '1.21'
depend: [BetterHud, PlaceholderAPI]
author: BeastSMP
description: Personal HUD designs, seasonal greetings and the lobby pumpkin hunt.
commands:
  profile:
    description: Your BeastSMP player profile
    aliases: [profil, spielerprofil]
  pet:
    description: Choose your visible lobby companion
    aliases: [companion, companions, begleiter, pets]
  settings:
    description: Personal BeastSMP language settings
  design:
    description: Choose your BeastSMP design
    aliases: [huddesign, designs]
  kuerbisse:
    description: Halloween pumpkin hunt progress and help
    aliases: [pumpkins, kuerbissuche]
  beasthud:
    description: BeastHUD administration
    permission: beasthud.admin
  beast:
    description: BeastSMP Lobby menu
    aliases: [menu, lobbymenu]
  serverauswahl:
    description: BeastSMP Server selection
    aliases: [servers, navigator]
  events:
    description: BeastSMP Events
  effekte:
    description: Personal lobby effects
    aliases: [effects]
  lobbyeffekte:
    aliases: [lobbyeffects]
    description: Manage server-wide lobby effects
    permission: beasthud.admin
permissions:
  beasthud.admin:
    default: op
